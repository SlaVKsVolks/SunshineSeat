<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
  <%- header %>
</head>

<body id="app" v-cloak>
  <Navbar></Navbar>
  <div class="container">
    <h1 class="my-4">{{ $t('pairing_password.title') }}</h1>
    <p>{{ $t('pairing_password.description') }}</p>

    <div class="alert alert-success" v-if="configured">
      {{ $t('pairing_password.configured') }}
    </div>
    <div class="alert alert-warning" v-else>
      {{ $t('pairing_password.not_configured') }}
    </div>

    <form @submit.prevent="save">
      <div class="card">
        <div class="card-body">
          <div class="mb-3">
            <label for="newPairingPassword" class="form-label">{{ $t('pairing_password.new_password') }}</label>
            <input id="newPairingPassword" name="newPassword" autocomplete="new-password" type="password"
              class="form-control" minlength="8" maxlength="128" required v-model="passwordData.newPassword" />
          </div>
          <div class="mb-3">
            <label for="confirmPairingPassword" class="form-label">{{ $t('pairing_password.confirm_password') }}</label>
            <input id="confirmPairingPassword" name="confirmNewPassword" autocomplete="new-password" type="password"
              class="form-control" minlength="8" maxlength="128" required v-model="passwordData.confirmNewPassword" />
          </div>
          <div class="form-text">{{ $t('pairing_password.password_policy') }}</div>
        </div>
      </div>

      <div class="alert alert-danger my-3" v-if="error">{{ error }}</div>
      <div class="alert alert-success my-3" v-if="success">
        <b>{{ $t('_common.success') }}</b> {{ $t('pairing_password.success') }}
      </div>
      <div class="mb-3 mt-4">
        <button class="btn btn-primary" type="submit">
          {{ $t('pairing_password.save') }}
        </button>
      </div>
    </form>
  </div>
</body>

<script type="module">
  import { createApp } from 'vue'
  import { initApp } from './init'
  import Navbar from './Navbar.vue'
  import { apiFetch } from './fetch_utils'

  const app = createApp({
    components: { Navbar },
    data() {
      return {
        configured: false,
        error: null,
        success: false,
        passwordData: {
          newPassword: '',
          confirmNewPassword: '',
        },
      }
    },
    mounted() {
      apiFetch('./api/pairing-password')
        .then((response) => response.json())
        .then((body) => {
          this.configured = body.configured === true
        })
        .catch(() => {
          this.error = 'Unable to load pairing password status'
        })
    },
    methods: {
      clearFields() {
        this.passwordData.newPassword = ''
        this.passwordData.confirmNewPassword = ''
      },
      save() {
        this.error = null
        this.success = false
        apiFetch('./api/pairing-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(this.passwordData),
        }).then((response) => {
          response.json().then((body) => {
            this.clearFields()
            if (response.status === 200 && body.status === true) {
              this.configured = true
              this.success = true
            } else {
              this.error = body.error || 'Unable to save pairing password'
            }
          }).catch(() => {
            this.clearFields()
            this.error = 'Unable to save pairing password'
          })
        }).catch(() => {
          this.clearFields()
          this.error = 'Unable to save pairing password'
        })
      },
    },
  })

  initApp(app)
</script>
